<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Salon Pro</title>
  <meta name="description" content="Appointments, billing, invoices, staff payroll and reports for parlors and barber shops in Pakistan.">
  <meta name="theme-color" content="#b5476b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-mark"><i class="bi bi-scissors"></i></div>
    <div class="splash-name">Salon Pro</div>
    <div class="splash-urdu">سیلون پرو</div>
    <div class="splash-bar"><span></span></div>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><i class="bi bi-scissors"></i></div>
        <div>
          <div class="brand-name" id="brandName">Salon Pro</div>
          <div class="brand-sub">Parlor &amp; Barber</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <i class="bi bi-cloud-check"></i> Saved on this device
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
        <div class="title-wrap">
          <div class="crumb" id="crumb">Salon Pro</div>
          <h1 class="page-title" id="pageTitle">Home</h1>
        </div>
        <div class="chip" id="dateChip"></div>
      </header>
      <main class="view" id="view"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
